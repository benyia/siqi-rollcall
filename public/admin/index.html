<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#fff7e8">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>班级后台 · 星星点名机</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
  <a class="skip-link" href="#admin-main">跳到主要内容</a>

  <div class="app">
    <main id="admin-main" tabindex="-1">
      <header class="topbar">
        <div class="brand">
          <span class="brand-sticker" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none">
              <path d="M32 7 40 23 58 26 45 38 48 56 32 48 16 56 19 38 6 26 24 23Z" fill="#FFD74A" stroke="#23314F" stroke-width="4.5" stroke-linejoin="round"/>
              <circle cx="25" cy="31" r="2.6" fill="#23314F"/>
              <circle cx="39" cy="31" r="2.6" fill="#23314F"/>
              <path d="M25.5 40c4.2 3.2 8.8 3.2 13 0" stroke="#23314F" stroke-width="3.5" stroke-linecap="round"/>
              <circle cx="20" cy="38" r="3.5" fill="#FF7D8D" opacity=".7"/>
              <circle cx="44" cy="38" r="3.5" fill="#FF7D8D" opacity=".7"/>
            </svg>
          </span>
          <div class="brand-copy">
            <h1>班级后台</h1>
            <p>星星点名机 · 班级和学生名单管理</p>
          </div>
        </div>
        <a class="admin-top-link" href="/">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h13M13 6.5 18.5 12 13 17.5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>打开点名页</span>
        </a>
      </header>

      <div class="admin-loading" id="loadingView">
        <p class="loading-copy" role="status">正在检查登录状态…</p>
      </div>

      <section class="login-shell" id="loginView" hidden>
        <div class="login-card">
          <div class="login-mascot" aria-hidden="true">
            <svg viewBox="0 0 180 180" fill="none">
              <path d="M90 18 109 60 155 65 121 96 130 142 90 119 50 142 59 96 25 65 71 60Z" fill="#FFD74A" stroke="#23314F" stroke-width="7" stroke-linejoin="round"/>
              <path d="M51 28 90 11 129 28 90 47Z" fill="#3B79DA" stroke="#23314F" stroke-width="6" stroke-linejoin="round"/>
              <circle cx="71" cy="83" r="5.2" fill="#23314F"/>
              <circle cx="109" cy="83" r="5.2" fill="#23314F"/>
              <path d="M72 101c10 9 26 9 36 0" stroke="#23314F" stroke-width="6" stroke-linecap="round"/>
              <circle cx="57" cy="97" r="8" fill="#FF7D8D" opacity=".62"/>
              <circle cx="123" cy="97" r="8" fill="#FF7D8D" opacity=".62"/>
            </svg>
          </div>
          <h2>老师登录</h2>
          <p>输入后台密码后，可以添加班级、粘贴学生名单，并在任何电脑上同步使用。</p>
          <form id="loginForm">
            <input type="text" name="username" autocomplete="username" value="teacher" hidden>
            <label class="field">
              <span>后台密码</span>
              <input id="passwordInput" type="password" autocomplete="current-password" required placeholder="请输入后台密码">
            </label>
            <button class="login-button" id="loginButton" type="submit">进入后台</button>
            <p class="login-error" id="loginError" role="alert"></p>
          </form>
        </div>
      </section>

      <section class="admin-view" id="adminView" hidden>
        <div class="admin-shell">
          <aside class="admin-sidebar" aria-labelledby="classListHeading">
            <div class="sidebar-head">
              <h2 id="classListHeading">班级</h2>
              <span id="adminClassCount">0 个</span>
            </div>
            <button class="new-class-button" id="newClassBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
              新建班级
            </button>
            <div class="admin-class-list" id="adminClassList" aria-live="polite"></div>
            <button class="sidebar-logout" id="logoutBtn" type="button">退出登录</button>
          </aside>

          <section class="admin-editor" aria-labelledby="editorTitle">
            <div class="editor-head">
              <div>
                <h2 id="editorTitle">新建班级</h2>
                <p>保存后，其他人打开点名页就能选择这个班级。</p>
              </div>
              <a class="open-class-link" id="openClassLink" href="/" target="_blank" rel="noopener" hidden>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M14 4h6v6M20 4l-9 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
                打开点名页
              </a>
            </div>

            <form class="admin-form" id="classForm">
              <div class="form-grid">
                <label class="field">
                  <span>班级名称</span>
                  <input id="classNameInput" type="text" maxlength="50" required placeholder="例如：三年级二班">
                </label>
                <label class="field">
                  <span>排序</span>
                  <input id="sortOrderInput" type="number" inputmode="numeric" min="-9999" max="9999" value="0">
                </label>
              </div>

              <label class="field">
                <span>班级说明（可选）</span>
                <input id="classDescriptionInput" type="text" maxlength="160" placeholder="例如：2026 秋季学期 · 班主任王老师">
              </label>

              <label class="field">
                <span class="roster-field-head">
                  <span>学生名单</span>
                  <span class="roster-count" id="rosterCount">0 人</span>
                </span>
                <textarea id="studentInput" rows="14" spellcheck="false" placeholder="每行一个名字，例如：&#10;林小满&#10;陈一诺&#10;周星河"></textarea>
                <span class="field-hint">一行一个名字。复制名单后直接粘贴即可，重复姓名和行首序号会自动处理。</span>
              </label>

              <div class="admin-help">
                排序数字越小，班级在点名页越靠前。删除班级时，该班级的学生名单也会一起删除，请谨慎操作。
              </div>

              <div class="form-actions">
                <div class="form-actions-main">
                  <button class="save-button" id="saveClassBtn" type="submit">保存班级</button>
                  <button class="delete-button" id="deleteClassBtn" type="button" hidden>删除班级</button>
                </div>
                <p class="editor-status" id="editorStatus" role="status"></p>
              </div>
            </form>
          </section>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/admin.js" defer></script>
</body>
</html>
